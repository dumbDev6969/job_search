<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechSprint</title>
    <link rel="stylesheet" href="/assets/fonts.css">
    <link rel="stylesheet" href="/assets/scheme.css">
    <!-- AOS CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous">
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="/assets/general.css">
    <style>
        .card-header{
        background-color: var(--primary);
      }
      .progress-title{
        color: var(--primary)
      }
      .progress-bar{
        background-color: var(--primary);
      }
    </style>
</head>

<body>

    
    <div class="container mt-5 py-5 d-flex justify-content-center flex-column align-items-center"  >
        <div class="mb-5 w-75">
        <div class="d-flex justify-content-between mb-2">
          <span class="progress-title  fw-bold">Step 2 of 2: Additional Details</span>
          <span>0%</span>
        </div>
        <div class="progress bg-light" style="height: 8px">
          <div class="progress-bar " style="width: 0%"></div>
        </div>
      </div>
        <div class="row d-flex align-items-center">
            
            <div data-aos="fade-right" class="col-md-6">
                <form action="#">
                   
                        
                        <div class=" mb-3">
                            <label for="company_name" class="form-label text-muted fw-bold">Company Name</label>
                            <input type="text"  id="company_name" name="company_name" placeholder="Company Name" required>
                        </div>
                    
                    
                    <div class="mb-3">
                        <label for="field" class="form-label text-muted fw-bold">Field</label>
                        <input type="text"  id="field" name="field" placeholder="Example. Programming, Multimedia , etc." required>
                    </div>
    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="company_size" class="form-label text-muted fw-bold">Company Size</label>
                            <select  id="company_size" name="company_size" required>
                                <option value="" selected disabled>Choose...</option>
                                <option value="1-10">1-10 employees</option>
                                <option value="11-50">11-50 employees</option>
                                <option value="51-200">51-200 employees</option>
                                <option value="201-500">201-500 employees</option>
                                <option value="500+">500+ employees</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="website" class="form-label text-muted fw-bold">Website</label>
                            <input type="url"  id="website" name="website" placeholder="Company Website">
                        </div>
                    </div>
    
                    <div class="mb-3">
                        <label for="logo_url" class="form-label text-muted fw-bold">Company Logo</label>
                        <input type="file"  id="logo_url" name="logo_url" accept="image/*">
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label text-muted fw-bold">Email</label>
                        <input type="email"  id="email" name="email" placeholder="Email"/>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label text-muted fw-bold">Password</label>
                        <input type="password"  id="password" name="password" placeholder="Password"/>
                    </div>
    
                    <button class="w-100 mt-3" type="button">Register</button>
                    <div class="mt-3">
                        <span class="text-secondary">Already have an account?</span> <a href="/auth/login.html">Log in</a>
                    </div>
                </form>
            </div>
            <div data-aos="fade-left" class="col-md-6">
                <img class="img-fluid" height="500" src="/assets/img/register.jpg" alt="register">
            </div>
        </div>
    </div>
    
    
    <!-- AOS JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script src="/assets/js/animation.js"></script>
    <script>
        AOS.init({
            duration: 1000, // Animation duration (1000ms = 1s)
            once: true, // Run animation only once when scrolling
        });
    </script>

</body>

</html>
