<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechSprint</title>
    <link rel="stylesheet" href="/assets/fonts.css">
    <link rel="stylesheet" href="/assets/scheme.css">
    <!-- AOS CSS -->
        <link rel="stylesheet" href="/aos-master/dist/aos.css">


    <link rel="stylesheet" href="/bootstrap-5.3.3-dist/css/bootstrap.min.css">

      <script src="/bootstrap-5.3.3-dist/js/bootstrap.bundle.min.js"></script>


    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="/assets/general.css">
    <style>
        /* Custom styles for the carousel */
        .carousel-item {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-light);
            background-color: var(--background-dark);
        }

        .slide {
            height: 60px;
        }
    </style>
</head>

<body>

    {% include '/components/nav.html'%}
    <div class="container  mb-5">
        <div class="row d-flex align-items-center">
            <div data-aos="fade-right" class="col-md-6 ">
                <form action="/signup" method="post">
                    <input type="text" name="csrf_token" value="{{ csrf_token() }}"/>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="name">Name</label>
                            <input type="text" class="form-control" id="name" name="name" placeholder="Name" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="last-name">Last name</label>
                            <input type="text" class="form-control" id="last-name" name="las-name" placeholder="Last name" required>
                        </div>
                    </div>
                    <div class=" mb-3">
                        <label for="phone">Phone</label>
                        <input type="text" class="form-control" id="phone" name="phone" placeholder="Phone number"/>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="municipality">Municipality</label>
                            <input type="text" class="form-control" id="municipality" name="municipality" placeholder="Municipality"/>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="province">Province</label>
                            <input type="text" class="form-control" id="province" name="province" placeholder="Province"/>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="degree">Degree</label>
                            <input type="text" class="form-control" id="degree" name="degree" placeholder="Degree" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="portfolio">Portfolio</label>
                            <input type="file" class="form-control" id="portfolio" name="portfolio" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="email">Email</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="Email"/>
                    </div>
                    <div class="mb-3">
                        <label for="password">Password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Password"/>
                    </div>
                    <button class="w-100 mt-3" type="submit">Sign up</button>
                    <div class="mt-3">
                        <span class="text-secondary">Already have an account?</span> <a href="/login">Log in</a>
                    </div>
                </form>
            </div>
            <div data-aos="fade-left" class="col-md-6 ">
                <img class="img-fluid" height="500" src="/assets/img/register.jpg" alt="register">
            </div>
        </div>
    </div>
    
    <footer class="footer p-2">
        <div class="container">
            <div class="row">
                <!-- Product Column -->
                <div class="col-md-3 col-sm-6 mb-4">
                    <h5>Product</h5>
                    <ul class="list-unstyled">
                        <li class="mb-2"><a href="#">Features</a></li>
                        <li class="mb-2"><a href="#">Pricing</a></li>
                    </ul>
                </div>

                <!-- Resources Column -->
                <div class="col-md-3 col-sm-6 mb-4">
                    <h5>Resources</h5>
                    <ul class="list-unstyled">
                        <li class="mb-2"><a href="#">Blog</a></li>
                        <li class="mb-2"><a href="#">User Guides</a></li>
                        <li class="mb-2"><a href="#">Webinars</a></li>
                    </ul>
                </div>

                <!-- Company Column -->
                <div class="col-md-3 col-sm-6 mb-4">
                    <h5>Company</h5>
                    <ul class="list-unstyled">
                        <li class="mb-2"><a href="#">About Us</a></li>
                        <li class="mb-2"><a href="#">Contact Us</a></li>
                    </ul>
                </div>

                <!-- Plans & Pricing Column -->
                <div class="col-md-3 col-sm-6 mb-4">
                    <h5>Plans & Pricing</h5>
                    <ul class="list-unstyled">
                        <li class="mb-2"><a href="#">Personal</a></li>
                        <li class="mb-2"><a href="#">Start Up</a></li>
                        <li class="mb-2"><a href="#">Organization</a></li>
                    </ul>
                </div>
            </div>

            <!-- Footer Bottom -->
            <div class="footer-bottom text-center">
                <p class="mb-0">© 2025 SCCP, Inc. • <i class="bi bi-facebook"></i> • <i class="bi bi-linkedin"></i> •
                    <i class="bi bi-instagram"></i></p>
            </div>
        </div>
    </footer>
    <!-- AOS JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script src="/assets/js/animation.js"></script>
    <script>
        AOS.init({
            duration: 1000, // Animation duration (1000ms = 1s)
            once: true, // Run animation only once when scrolling
        });
    </script>

</body>

</html>
