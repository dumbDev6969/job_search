<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/assets/fonts.css">
    <link rel="stylesheet" href="/assets/scheme.css">
    <!-- AOS CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous">
        </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="/assets/general.css">
   
</head>

<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-around " id="navbarSupportedContent">
                <ul class="navbar-nav gap-3 mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Jobs</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                            aria-expanded="false">
                            Resources
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">Resume Tips</a></li>
                            <li><a class="dropdown-item" href="#">Interview Prep</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item" href="#">Career Advice</a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#features">Features</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#about">About us</a>
                    </li>
                </ul>
                <form class=" ms-3 gap-2" role="search">
                    <a href="/signup">
                        <button class="sign-up" type="button">Sign up</button>
                    </a>
                    <a href="#">
                        <button class="btn-primary" type="button">Sign in</button>
                    </a>
                </form>
            </div>
        </div>
    </nav>
    <div class="container mt-5 py-5">
        <div class="row d-flex align-items-center">
            <div data-aos="fade-right" class="col-md-6">
                <form action="/signup/employer" method="POST">
                    <input type="hidden" id="csrf_token" name="csrf_token" value="{{ csrf_token() }}"/>


                    <div class=" mb-3">
                        <label for="company_name" class="form-label text-muted fw-bold">Company Name</label>
                        <input type="text" id="company_name" name="company_name"
                            placeholder="Company Name" required>
                    </div>


                    <div class="mb-3">
                        <label for="field" class="form-label text-muted fw-bold">Field</label>
                        <input type="text" id="field" name="field" placeholder="Example. Programming, Multimedia , etc."
                            required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="company_size" class="form-label text-muted fw-bold">Company Size</label>
                            <select id="company_size" name="company_size" required>
                                <option value="" selected disabled>Choose...</option>
                                <option value="1-10">1-10 employees</option>
                                <option value="11-50">11-50 employees</option>
                                <option value="51-200">51-200 employees</option>
                                <option value="201-500">201-500 employees</option>
                                <option value="500+">500+ employees</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="website" class="form-label text-muted fw-bold">Website</label>
                            <input type="url" id="website" name="website" placeholder="Company Website">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="logo_url" class="form-label text-muted fw-bold">Company Logo</label>
                        <input type="file" id="logo_url" name="logo_url" accept="image/*">
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label text-muted fw-bold">Email</label>
                        <input type="email" id="email" name="email" placeholder="Email" />
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label text-muted fw-bold">Password</label>
                        <input type="password" id="password" name="password" placeholder="Password" />
                    </div>

                    <button class="w-100 mt-3" type="submit">Register</button>
                    <div class="mt-3">
                        <span class="text-secondary">Already have an account?</span> <a href="/login">Log in</a>
                    </div>
                </form>
            </div>
            <div data-aos="fade-left" class="col-md-6">
                <img class="img-fluid" height="500" src="/assets/img/register.jpg" alt="register">
            </div>
        </div>
    </div>


    <!-- AOS JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script src="/assets/js/animation.js"></script>
    <script>
        AOS.init({
            duration: 1000, // Animation duration (1000ms = 1s)
            once: true, // Run animation only once when scrolling
        });
    </script>

</body>

</html>
