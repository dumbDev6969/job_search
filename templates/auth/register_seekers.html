<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobxTech</title>
    <link rel="stylesheet" href="/assets/fonts.css">
    <link rel="stylesheet" href="/assets/scheme.css">
    <!-- AOS CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous">
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="/assets/general.css">

</head>

<body>

    <div class="container" style="margin-top: 100px">
        <div class="row d-flex align-items-center">
            <div data-aos="fade-right" class="col-md-6 ">
                <form id="signup-form" action="/signup/jobseeker" method="post" enctype="multipart/form-data">
                    <div class="row">
                        <input type="hidden" id="csrf_token" name="csrf_token" value="{{ csrf_token() }}"/>
                        <div class="col-md-6 mb-3">
                            <label for="first_name" class="form-label text-muted fw-bold">Name</label>
                            <input type="text" class="form-control" id="first_name" name="first_name" placeholder="Name" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="last_name" class="form-label text-muted fw-bold">Last name</label>
                            <input type="text" class="form-control" id="last_name" name="last_name" placeholder="Last name" required>
                        </div>
                    </div>
                    <div class=" mb-3">
                        <label for="phone" class="form-label text-muted fw-bold">Phone</label>
                        <input type="text" class="form-control" id="phone" name="phone" placeholder="Phone number"/>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="province" class="form-label text-muted fw-bold">Province</label>
                            <input type="text" class="form-control" id="province" name="province" placeholder="Province"/>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="municipality" class="form-label text-muted fw-bold">Municipality</label>
                            <input type="text" class="form-control" id="municipality" name="municipality" placeholder="Municipality"/>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="degree" class="form-label text-muted fw-bold">Degree</label>
                        <input type="text" class="form-control" id="degree" name="degree" placeholder="Your degree">
                    </div>
                    <div class=" mb-3">
                        <label for="portfolio" class="form-label text-muted fw-bold">Portfolio</label>
                        <input type="file" class="form-control" id="portfolio" name="portfolio">
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label text-muted fw-bold">Email</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="Email"/>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label text-muted fw-bold">Password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Password"/>
                    </div>
                    <button class="w-100 mt-3" type="submit">Sign up</button>
                    <div class="mt-3">
                        <span class="text-secondary">Already have an account?</span> <a href="/login">Log in</a>
                    </div>
                </form>
            </div>
            <div data-aos="fade-left" class="col-md-6 ">
                <img class="img-fluid" height="500" src="/assets/img/register.jpg" alt="register">
            </div>
        </div>
    </div>

    <!-- AOS JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script src="/assets/js/animation.js"></script>
    <script>
        AOS.init({
            duration: 1000, // Animation duration (1000ms = 1s)
            once: true, // Run animation only once when scrolling
        });
    </script>

    <script>
    document.getElementById('signup-form').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const formData = new FormData(this);
        
        fetch('/signup/jobseeker', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                window.location.href = '/login';
            } else {
                alert(data.details || data.error || 'Registration failed');
            }
        })
        .catch(error => {
            alert('An error occurred during registration. Please try again.');
            console.error('Error:', error);
        });
    });
    </script>

</body>

</html>
