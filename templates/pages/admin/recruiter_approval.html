<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Job Approval</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="/assets/general.css">
    <link rel="stylesheet" href="/assets/scheme.css">
    <link rel="stylesheet" href="/assets/animation.css">

    <link rel="stylesheet" href="/assets/admin.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <!-- SweetAlert2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>

<body>
    <header data-aos="fade-down" class="border-bottom p-2">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <h3>Admin Dashboard</h3>
            <button class="btn d-md-none m-3" type="button" data-bs-toggle="collapse" data-bs-target="#sidebarMenu"
                aria-controls="sidebarMenu" aria-expanded="false" aria-label="Toggle navigation">
                <i class="fas fa-bars fa-lg"></i>
            </button>
        </div>
    </header>

    <div class="d-flex">
        <!-- Sidebar (consistent with other pages) -->
        <nav id="sidebarMenu" class="d-md-block sidebar collapse border-end"
            style="min-width: 250px; height: 100vh; position: sticky; top: 0;">
            <div class="position-sticky pt-3 px-3">
                <ul class="nav flex-column">
                    <li class="nav-item mb-2">
                        <a class="nav-link d-flex align-items-center text-dark" href="/admin/dashboard.html">
                            <i class="fas fa-home me-2"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="nav-link d-flex align-items-center text-dark" href="job_approval.html">
                            <i class="fas fa-clipboard-check me-2"></i> Job Approval
                        </a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="nav-link active d-flex align-items-center text-dark" href="recruiter_approval.html">
                            <i class="fas fa-clipboard-check me-2"></i> Recruiter Approval
                        </a>
                    </li>
                    <li class="nav-item mb-2">
    <a class="nav-link d-flex align-items-center text-dark" href="/logout">
        <i class="fas fa-sign-out-alt me-2"></i> Logout
    </a>
</li>
                </ul>
            </div>
        </nav>

        <!-- Main Content -->
        <div data-aos="fade-left" class="container-fluid py-5" style="flex: 1;">
            <!-- Filter Section -->
            <div class="row">
                <div class="col-12">
                    <div class="border-0">
                        <div class="card-body">
                            <div class="row g-3 align-items-end">
                                <!-- Search -->
                                <div class="col-md-4">
                                    <label for="searchInput" class="form-label">Search Company</label>
                                    <input type="text" class="form-control" id="searchInput"
                                        placeholder="e.g. TechCorp">
                                </div>

                                <!-- Status Filter -->
                                <div class="col-md-3">
                                    <label for="statusFilter" class="form-label">Status</label>
                                    <select id="statusFilter">
                                        <option value="all">All Statuses</option>
                                        <option value="new">New</option>
                                        <option value="pending">Pending Review</option>
                                        <option value="approved">Approved</option>
                                        <option value="rejected">Rejected</option>
                                    </select>
                                </div>

                                <!-- Action Buttons -->
                                <div class="col-md-2 d-grid gap-2 ms-auto d-none">
                                    <button id="filterBtn" class="btn btn-primary">
                                        <i class="fas fa-filter me-1"></i> Filter
                                    </button>
                                    <button id="resetBtn" class="btn btn-secondary">
                                        <i class="fas fa-sync-alt me-1"></i> Reset
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Recruiters Container -->
            <div class="row mt-4" id="recruitersContainer">
                <!-- Recruiter Card 1 - Pending -->


            </div>

            <!-- No Results Message -->

        </div>
    </div>

    <!-- Requirements Modal -->
    <div class="modal fade" id="requirementsModal" tabindex="-1" aria-labelledby="requirementsModalLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="requirementsModalLabel">Recruiter Requirements</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="requirementsContent">
                    <!-- Dynamic content will be loaded here -->
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>
    <input type="hidden" name="csrf_token" id="csrf_token" value="{{ csrf_token() }}">
    <!-- AOS JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script src="/assets/js/animation.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
    <script src="/assets/js/recruiter_approval.js"></script>
    <script>

        fetch('/admin/get_recruiter_by_status')
            .then(response => response.json())
            .then(data => {
                const recruitersContainer = document.getElementById('recruitersContainer');
                recruitersContainer.innerHTML = data.html;
            });
    </script>

    <script>
        function fetchRecruiters() {
            const companyName = document.getElementById("searchInput").value.trim();
            const status = document.getElementById("statusFilter").value;

            let url = "/admin/search_recruiter_approval";
            const params = [];

            if (status) params.push(`status=${encodeURIComponent(status)}`);
            if (companyName) params.push(`company_name=${encodeURIComponent(companyName)}`);

            if (params.length > 0) {
                url += "?" + params.join("&");
            }

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        // Clear current recruiter items
                        const recruitersContainer = document.getElementById('recruitersContainer');
                        recruitersContainer.innerHTML = data.html;
                    } else {
                        console.error("Error fetching recruiters:", data.error);
                    }
                })
                .catch(err => {
                    console.error("AJAX Error:", err);
                });
        }

        // Attach event listeners
        document.getElementById("searchInput").addEventListener("keyup", fetchRecruiters);
        document.getElementById("statusFilter").addEventListener("change", fetchRecruiters);

        // Optionally, load initial data based on current filters
        window.addEventListener("DOMContentLoaded", fetchRecruiters);

        
    </script>

</body>

</html>
