<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Job Approval</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="/assets/general.css">
    <link rel="stylesheet" href="/assets/scheme.css">
    <link rel="stylesheet" href="/assets/animation.css">
<!-- SweetAlert2 CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css"> 

<!-- SweetAlert2 JS -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> 
    <link rel="stylesheet" href="/assets/admin.css">
</head>
<body>
        <input type="hidden" name="csrf_token" id="csrf_token" value="{{ csrf_token() }}">

    <header data-aos="fade-down" class="border-bottom p-2">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <h3>Admin dashboard</h3>
            <button class="btn d-md-none m-3" type="button" data-bs-toggle="collapse" data-bs-target="#sidebarMenu" aria-controls="sidebarMenu" aria-expanded="false" aria-label="Toggle navigation">
                <i class="fas fa-bars fa-lg"></i>
            </button>
        </div>
    </header>
    
    <div class="d-flex">
        <!-- Side Navigation -->
        <nav data-aos="fade-right" id="sidebarMenu" class="d-md-block sidebar collapse border-end" style="min-width: 250px; height: 100vh; position: sticky; top: 0;">
        
        <div class="position-sticky pt-3 px-3">
            <ul class="nav flex-column">
            <li class="nav-item mb-2">
                <a class="nav-link active d-flex align-items-center text-dark" href="/admin/dashboard.html">
                <i class="fas fa-home me-2"></i> Dashboard
                </a>
            </li>
            <li class="nav-item mb-2">
                <a class="nav-link d-flex align-items-center text-dark" href="job_approval.html">
                <i class="fas fa-clipboard-check me-2"></i> Job Approval
                </a>
            </li>
            <li class="nav-item mb-2">
                <a class="nav-link d-flex align-items-center text-dark" href="recruiter_approval.html">
                <i class="fas fa-clipboard-check me-2"></i> Recruiter Approval
                </a>
            </li>
            </ul>
        </div>
    </nav>

        <!-- Main Content -->
        <div data-aos="fade-left" class="container-fluid py-5" style="flex: 1;">
            
                <!-- Filter Section -->
                <div class="row">
                    <div class="col-12">
                        <div class="border-0">
                            <div class="card-body">
                                <div class="row g-3 align-items-end">
                                    <!-- Search -->
                                    <div class="col-md-4">
                                        <label for="searchInput"  class="form-label">Search Job Title</label>
                                        <input type="text" class="form-control" name="search_query"  id="searchInput" placeholder="e.g. Frontend Developer">
                                    </div>
            
                                    <!-- Status Filter -->
                                    <div class="col-md-3">
                                        <label for="statusFilter" class="form-label">Status</label>
                                        <select class="form-select" id="statusFilter" name="status_filter">
                                            <option value="all">All Statuses</option>
                                            <option value="0">Pending Review</option>
                                            <option value="1">Approved</option>
                                            <option value="3">Rejected</option>
                                        </select>
                                    </div>
            
                                    <!-- Type Filter -->
                                    <div class="col-md-3">
                                        <label for="typeFilter" class="form-label">Type</label>
                                        <select class="form-select" id="typeFilter" name="type_filter">
                                            <option value="all">All Types</option>
                                            <option value="full-time">Full-time</option>
                                            <option value="contract">Contract</option>
                                            <option value="part-time">Part-time</option>
                                        </select>
                                    </div>
            
                                    <!-- Action Buttons -->
                                    <div class="col-md-2 d-grid gap-2">
                                        <button id="filterBtn" class="btn btn-primary">
                                            <i class="fas fa-filter me-1"></i> Filter
                                        </button>
                                        <button id="resetBtn" class="btn btn-secondary">
                                            <i class="fas fa-sync-alt me-1"></i> Reset
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Jobs Container -->
                <div  class="row mt-4" id="jobsContainer">
                    <!-- Job cards will be loaded here by JavaScript -->
                    <div class="col-12 text-center py-5">
                        <p>Loading jobs or use filters to display jobs...</p>
                    </div>
                </div>

                <!-- No Results Message will be part of jobsContainer if applicable -->
            </div>
        </div>  
    
    <!-- AOS JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script src="/assets/js/animation.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script> <!-- Ensure consistent Bootstrap JS version -->
    <script src="/assets/js/job_approval.js"></script>
</body>
</html>
