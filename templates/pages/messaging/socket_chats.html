<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechSprint</title>
    <link rel="stylesheet" href="/assets/fonts.css" />
    
    <!-- AOS CSS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"

      crossorigin="anonymous"
    />

    <script

  <style>
    .sidebar {
      height: 100vh;
      overflow-y: auto;
    }

    .chat-body {
      flex: 1;
      overflow-y: auto;
    }

    .message.received .bubble {
      background-color: #e9ecef;
      border-top-left-radius: 0;
    }

    .message.sent .bubble {
      background-color: var(--primary);
      color: white;
      border-top-right-radius: 0;
    }
  </style>

  <body>
    <div class="container-fluid">
      <div class="row g-0 vh-100">
        <!-- Sidebar -->
        <div class="col-md-4 border-end sidebar bg-white">
          <div class="d-flex align-items-center p-3 border-bottom">
            <h4 class="mb-0 text-center">Messages</h4>
            <i class="fas fa-envelope ms-auto text-primary"></i>
          </div>

          <div class="p-3">
            <input
              type="text"
              class="form-control mb-3"
              placeholder="Find people and groups"
            />
            <div id="search-results"></div>

            <ul class="list-group list-group-flush" id="convo-list">
           
            </ul>
            
          </div>
        </div>
        <!-- <h1>{{info}}</h1> -->
        <!-- Chat Panel -->
        <div class="col-md-8 chat-container d-flex flex-column">
          <div class="d-flex align-items-center p-3 border-bottom bg-white">
            <div class="flex-grow-1 d-flex">
              {%if name%}
              <img src="https://api.dicebear.com/7.x/initials/svg?seed={{name[0]}}" height="50" class="rounded-circle me-3" alt="Avatar">
             <div class="">
              <h5 class="mb-0" id="render-name">{{name}}</h5>
              <small class="text-body-tertiary" id="render-email"
                >{{email}}</small
              >
             </div>
             {%endif%}
            
            </div>
            <i class="fas fa-info-circle text-primary fs-4"></i>
          </div>

          <!-- Messages -->
        
           <div class="chat-body p-3" id="render-conversation">
           </div>
         
          <!-- <div class="chat-body p-3"  hx-get="/messages/conversation/{{coversation_id}}" hx-trigger="every 0.1s"> -->

              <div class="bubble d-inline-block p-3 rounded-4 bg-light">
                Lorem ipsum dolor sit amet...
                <div class="small text-muted mt-1">3 Oct 2019 10:24 am</div>
              </div>
            </div>

            <div class="message sent mb-3 text-end">
              <div
                class="bubble d-inline-block p-3 rounded-4 bg-primary text-white"
              >
                Lorem ipsum dolor sit amet...
                <div class="small text-white-50 mt-1">3 Oct 2019 10:30 am</div>
              </div>
            </div> -->

            <!-- Add more messages -->
          <!-- </div> -->
    
          <input type="hidden" name="" id="conversation_id" value="{{coversation_id}}">
          <input type="hidden" name="" id="user_id" value="{{user_id}}">
          
          <!-- Input Footer -->
          <div class="p-3 border-top bg-white">
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0">
                <i class="fas fa-paperclip text-muted"></i>
              </span>
              <input
                type="text"
                class="form-control border-start-0"
                placeholder="Write a message"
                name="message"
              />
              <button class="btn btn-primary px-3" id="send-message-btn">
                <i class="fas fa-paper-plane"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script src="/assets/js/animation.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>

    <script>
      var user_to_recieve = document.getElementById("user_id").value;
    convo_list = document.getElementById("convo-list");
      AOS.init({
        duration: 1000, // Animation duration (1000ms = 1s)
        once: true, // Run animation only once when scrolling
      });

      document
        .querySelector('input[placeholder="Find people and groups"]')
        .addEventListener("keyup", function (e) {
          const query = e.target.value.trim();
          const chatList = document.getElementById("chat-list");
          const searchResults = document.getElementById("search-results");
          if (query.length > 0) {
            chatList.style.display = "none";
            fetch(`/api/messages/users/search?q=${encodeURIComponent(query)}`)
              .then((response) => response.text())
              .then((html) => {
                searchResults.innerHTML = html;
                searchResults.style.display = "block";
              })
              .catch((error) =>
                console.error("Error fetching search results:", error)
              );
          } else {
            searchResults.innerHTML = "";
            searchResults.style.display = "none";
            chatList.style.display = "block";
            fetch("/api/messages/chat-partners")
              .then((response) => response.text())
              .then((html) => {
                chatList.innerHTML = html;
              })
              .catch((error) =>
                console.error("Error fetching chat partners:", error)
              );
          }
        });

      
      const socket = io();

    // get chat lsit
    socket.emit("get_conversation_list");

    socket.emit('get_conversations',data);
    })
    socket.on('refresh_convo_list',function(data){
        alert("refreshing conversation list");
        convo_list.innerHTML = data.data;
    })

    
    document.getElementById('send-message-btn').addEventListener('click', function() {
        const messageInput = document.querySelector('input[name="message"]');
        const message = messageInput.value.trim();
        
        if (message && user_to_recieve) {
            socket.emit('send_message',{
                message:message,
                receiver_id:user_to_recieve,
                conversation_id:document.getElementById("conversation_id").value,
            })

      document.querySelector('input[name="message"]').addEventListener('keydown', function(e) {
        if (e.key === "Enter") {
          e.preventDefault();
          document.getElementById('send-message-btn').click();

</html>
