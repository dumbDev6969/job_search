<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JXT</title>
    <link rel="stylesheet" href="/assets/fonts.css">
    <link rel="stylesheet" href="/assets/scheme.css">
    <!-- AOS CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous">
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="/assets/general.css">

</head>

<body>
    <style>
        .table-container {
            overflow: auto;
            max-height: 400px;
        }

        .fixed-filters {
            position: sticky;
            top: 0;
            background: white;
            z-index: 100;
            padding-bottom: 10px;
        }
    </style>

    {% include 'components/recruiter-nav.html' %}

    <div class="container pt-5 mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Candidate Search</h2>
            <div class="text-muted" id="candidateCount">Loading candidates...</div>
        </div>
        <!-- Search and Filters -->
        <div class="card mb-4 border-0 shadow-sm" data-aos="fade-right">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-4">
                        <div class="search-box position-relative">
                            <i class="fas fa-search position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"></i>
                            <input type="text" class="form-control ps-5" placeholder="Search by name, skills..." id="search">
                        </div>
                    </div>
                    <div class="col-md-8">
                        <div class="row g-2">
                            <div class="col-md">
                                <select name="salary-range" title="Select a salary range" id="salary">
                                    <option value="" selected>All Salary Ranges</option>
                                    <option>20,000 - 35,000</option>
                                    <option>35,000 - 50,000</option>
                                    <option>50,000 - 75,000</option>
                                    <option>75,000+</option>
                                </select>
                            </div>
                            <div class="col-md">
                                <select name="location" title="Select a location" id="location">
                                    <option value="" selected>All Locations</option>
                                    <option>Remote</option>
                                    <option>On-site</option>
                                    <option>Hybrid</option>
                                </select>
                            </div>
                            <div class="col-md">
                                <select name="skills" title="Select a skill" id="skills">
                                    <option value="" selected>All Skills</option>
                                    <option>JavaScript</option>
                                    <option>Python</option>
                                    <option>UI/UX</option>
                                    <option>AI/ML</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Candidates Table -->
        <div class="card border-0 shadow-sm" data-aos="fade-up">
            <div class="table-responsive" style="max-height: 500px; overflow-y: auto;">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light" style="position: sticky; top: 0; z-index: 1; background-color: white;">
                        <tr>
                            <th width="40"><input type="checkbox" class="form-check-input" id="select-all"></th>
                            <th>Name</th>
                            <th>Status</th>
                            <th>Skills</th>
                            <th>Salary Expectation</th>
                            <th>Location</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="table-listing">
                        <!-- Table rows will be dynamically loaded here -->
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div class="card-footer bg-white">
                <nav aria-label="Candidate pagination">
                    <ul class="pagination justify-content-center mb-0" id="pagination-links">
                        <!-- Pagination links will be dynamically loaded here -->
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <!-- AOS JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script src="/assets/js/animation.js"></script>
    <script>
        AOS.init({
            duration: 1000, // Animation duration (1000ms = 1s)
            once: true, // Run animation only once when scrolling
        });

        const search = document.getElementById('search');
        const salary = document.getElementById('salary');
        const selected_location = document.getElementById('location');
        const skills = document.getElementById('skills');
        const tableListing = document.getElementById('table-listing');
        const paginationLinks = document.getElementById('pagination-links');
        const candidateCountEl = document.getElementById('candidateCount');
        let currentPage = 1; // Keep track of the current page
        
        // Event listeners
        search.addEventListener('keyup', () => updateTable(1)); // Reset to page 1 on new search/filter
        salary.addEventListener('change', () => updateTable(1));
        selected_location.addEventListener('change', () => updateTable(1));
        skills.addEventListener('change', () => updateTable(1));

        function updateTable(page) {
            currentPage = page;
            const params = new URLSearchParams({
                search: search.value,
                salary: salary.value,
                location: selected_location.value,
                skills: skills.value,
                page: currentPage
            });

            fetch(`/api/employer/find-talent?${params}`)
                .then(response => response.json())
                .then(data => {
                    tableListing.innerHTML = data.html;
                    const totalPages = data.total_pages;
                    const currentPageFromApi = data.current_page;
                    const totalRecords = data.total_records;

                    if (candidateCountEl && totalRecords !== undefined) {
                        candidateCountEl.textContent = `Showing ${totalRecords} candidates`;
                    } else if (candidateCountEl) {
                        candidateCountEl.textContent = 'Candidate count unavailable';
                    }

                    console.log("current_page from API:", currentPageFromApi);
                    console.log("total_pages from API:", totalPages);
                    
                    renderPagination(totalPages, currentPageFromApi);
                })
                .catch(error => {
                    console.error("Error fetching table data:", error);
                    if (candidateCountEl) candidateCountEl.textContent = 'Error fetching candidates';
                    tableListing.innerHTML = '<tr><td colspan="7" class="text-center">Error loading candidates. Please try again.</td></tr>';
                    paginationLinks.innerHTML = ''; // Clear pagination on error
                });
        }

        function renderPagination(totalPages, currentPage) {
            paginationLinks.innerHTML = ''; // Clear existing links

            // Ensure totalPages is a valid number for pagination
            if (typeof totalPages !== 'number' || isNaN(totalPages) || totalPages < 1) { // Allow totalPages = 1
                console.log("Pagination not rendered: totalPages =", totalPages, "(must be a number >= 1)");
                return; 
            }
            // Ensure currentPage is a valid number, default to 1 if not
            if (typeof currentPage !== 'number' || isNaN(currentPage) || currentPage < 1) {
                console.warn("Pagination: currentPage is not a valid number. Defaulting to 1. Received:", currentPage);
                currentPage = 1;
            }
            if (currentPage > totalPages) {
                console.warn("Pagination: currentPage is greater than totalPages. Setting to totalPages. Received:", currentPage, "Total:", totalPages);
                currentPage = totalPages;
            }

            // Previous Button
            let prevDisabled = currentPage === 1 ? 'disabled' : '';
            const prevPage = Math.max(1, currentPage - 1);
            paginationLinks.innerHTML += `
                <li class="page-item ${prevDisabled}">
                    <a class="page-link" href="#" tabindex="-1" onclick="event.preventDefault(); if (${currentPage !== 1}) updateTable(${prevPage});">Previous</a>
                </li>
            `;

            // Page Number Links
            for (let i = 1; i <= totalPages; i++) {
                let activeClass = i === currentPage ? 'active' : '';
                paginationLinks.innerHTML += `
                    <li class="page-item ${activeClass}">
                        <a class="page-link" href="#" onclick="event.preventDefault(); if (this.parentElement.classList.contains('active')) return; updateTable(${i});">${i}</a>
                    </li>
                `;
            }

            // Next Button
            let nextDisabled = currentPage === totalPages ? 'disabled' : '';
            const nextPage = Math.min(totalPages, currentPage + 1);
            paginationLinks.innerHTML += `
                <li class="page-item ${nextDisabled}">
                    <a class="page-link" href="#" onclick="event.preventDefault(); if (${currentPage !== totalPages}) updateTable(${nextPage});">Next</a>
                </li>
            `;
        }

        // Initial load
        updateTable(1);
    </script>
</body>

</html>
