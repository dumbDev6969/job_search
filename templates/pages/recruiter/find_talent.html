<script>
    AOS.init({
        duration: 1000,
        once: true,
    });

    let currentPage = 1;
    const itemsPerPage = 10;

    function fetchTalents(page = 1) {
        const searchName = document.getElementById('search-name').value;
        const salaryRange = document.getElementById('salary-range').value;
        const location = document.getElementById('location').value;
        const skills = document.getElementById('skills').value;

        const params = new URLSearchParams({
            name: searchName,
            salary: salaryRange,
            location: location,
            skills: skills,
            page: page,
            per_page: itemsPerPage
        });

        fetch(`/employer/api/find-talent?${params}`)
            .then((response) => response.json())
            .then((data) => {
                if (!data.talents || data.talents.trim() === '') {
                    document.getElementById("table-talent").innerHTML = "<tr><td colspan='7'>No candidates found.</td></tr>";
                } else {
                    document.getElementById("table-talent").innerHTML = data.talents;
                    updatePagination(data.total_pages, page);
                }
            });
    }

    function updatePagination(totalPages, currentPage) {
        const pagination = document.querySelector('.pagination');
        let paginationHtml = `
            <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
                <a class="page-link" href="#" onclick="fetchTalents(${currentPage - 1}); return false;">Previous</a>
            </li>`;

        for (let i = 1; i <= totalPages; i++) {
            paginationHtml += `
                <li class="page-item ${i === currentPage ? 'active' : ''}">
                    <a class="page-link" href="#" onclick="fetchTalents(${i}); return false;">${i}</a>
                </li>`;
        }

        paginationHtml += `
            <li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
                <a class="page-link" href="#" onclick="fetchTalents(${currentPage + 1}); return false;">Next</a>
            </li>`;

        pagination.innerHTML = paginationHtml;
    }

    // Add event listeners for real-time filtering
    const filterInputs = ['search-name', 'salary-range', 'location', 'skills'];
    filterInputs.forEach(id => {
        document.getElementById(id).addEventListener('input', () => fetchTalents(1));
    });

    // Initial fetch
    fetchTalents(1);
</script>
