<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JXT - Job Postings</title>
    <link rel="stylesheet" href="/assets/fonts.css">
    <link rel="stylesheet" href="/assets/scheme.css">
    <!-- AOS CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.0.16/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.0.16/dist/sweetalert2.all.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous">
        </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="/assets/general.css">
    <style>
        .status-badge {
            font-size: 0.8rem;
            padding: 0.35em 0.65em;
        }

        .pagination .page-item.active .page-link {
            background-color: var(--primary);
            border-color: var(--primary);
        }

        .pagination .page-link {
            color: var(--primary);
        }

        .search-box {
            position: relative;
        }

        .search-box .form-control {
            padding-left: 2.5rem;
        }

        .search-box i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }
    </style>
</head>

<body>

    {% include 'components/recruiter-nav.html' %}





    <div class="container pt-5 mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Job Postings</h2>
            <div class="search-box" style="width: 300px;">
                <i class="fas fa-search"></i>
                <input type="text" class="form-control" placeholder="Search jobs..." id="searchInput">
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-3">
                <select class="form-select mb-2" id="statusFilter">
                    <option value="all" selected>All Statuses</option>
                    <option value="active">Active</option>
                    <option value="paused">Paused</option>
                    <option value="closed">Closed</option>
                   
                </select>
            </div>
            <div class="col-md-3">
                <select class="form-select mb-2" id="typeFilter">
                    <option value="all" selected>All Types</option>
                    <option value="full-time">Full-time</option>
                    <option value="part-time">Part-time</option>
                    <option value="contract">Contract</option>
                    <option value="internship">Internship</option>
                </select>
            </div>
            <div class="col-md-3">
                <select class="form-select mb-2" id="sortFilter">
                    <option value="newest" selected>Sort by: Newest</option>
                    <option value="oldest">Oldest</option>
                    <option value="most_applications">Most Applications</option>
                    <option value="alphabetical">Alphabetical</option>
                </select>
            </div>
            <div class="col-md-3">

                <select class="form-select" id="statusFilter1" name="status_filter1">
                    <option value="all">All Statuses</option>
                    <option value="0">Pending Review</option>
                    <option value="1">Approved</option>
                    <option value="3">Rejected</option>
                </select>
            </div>

        </div>

        <div class="row" id="jobsContainer">


        </div>
    </div>
    <input type="hidden" id="csrf_token" name="csrf_token" value="{{ csrf_token() }}" />

    <script>
        function fetchJobs() {
            const status = document.getElementById('statusFilter').value;
            const type = document.getElementById('typeFilter').value;
            const sort = document.getElementById('sortFilter').value;
            const statusFilter1 = document.getElementById('statusFilter1').value;

            const searchQuery = document.querySelector('.search-box input').value;
            fetch(`/api/employer/get-job-cards?status=${status}&type=${type}&sort=${sort}&statusFilter=${statusFilter1}&search=${encodeURIComponent(searchQuery)}`)
                .then(response => response.text())
                .then(data => {
                    console.log(data);
                    if (data.trim() === '') {
                        document.getElementById('jobsContainer').innerHTML = `<div class="col-12 text-center py-5">
                    <div class="no-data-found">
                        <i class="fas fa-folder-open fa-3x text-muted mb-3"></i>
                        <h5 class="text-muted">No Jobs Found</h5>
                        <p class="text-muted">You haven't posted any jobs yet.</p>
                        <a href="/employer/post-job" class="btn btn-primary mt-2">
                            <i class="fas fa-plus me-2"></i>Post a New Job
                        </a>
                    </div>
                </div>`;
                        return;
                    }
                    document.getElementById('jobsContainer').innerHTML = data;
                })
                .catch(error => {
                    console.error('Error fetching jobs:', error);
                });
        }

        // Add event listeners to filters
        document.getElementById('statusFilter').addEventListener('change', fetchJobs);
         document.getElementById('statusFilter1').addEventListener('change', fetchJobs);
        document.getElementById('typeFilter').addEventListener('change', fetchJobs);
        document.getElementById('sortFilter').addEventListener('change', fetchJobs);
        document.getElementById('searchInput').addEventListener('input', fetchJobs);
      
        // Initial load
        fetchJobs();
        function deleteJob(jobId) {
            if (confirm('Are you sure you want to delete this job?')) {
                fetch('/employer/api/delete-job', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams({
                        'id': jobId,
                        'csrf_token': document.getElementById('csrf_token').value,
                    }),
                })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            alert('Job deleted successfully!');
                            fetchJobs(); // Refresh the job list
                        } else {
                            alert('Failed to delete job: ' + data.error);
                        }
                    })
                    .catch(error => {
                        console.error('Error deleting job:', error);
                        alert('An error occurred while deleting the job.');
                    });
            }
        }
        function deleteJob(jobId) {
            Swal.fire({
                title: 'Are you sure?',
                text: "You won't be able to revert this!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#3085d6',
                cancelButtonColor: '#d33',
                confirmButtonText: 'Yes, delete it!'
            }).then((result) => {
                if (result.isConfirmed) {
                    fetch('/employer/api/delete-job', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                        },
                        body: new URLSearchParams({
                            'id': jobId,
                            'csrf_token': document.getElementById('csrf_token').value,
                        }),
                    })
                        .then(response => response.json())
                        .then(data => {
                            if (data.success) {
                                Swal.fire(
                                    'Deleted!',
                                    'The job has been deleted.',
                                    'success'
                                );
                                fetchJobs(); // Refresh the job list
                            } else {
                                Swal.fire(
                                    'Error!',
                                    'Failed to delete job: ' + data.error,
                                    'error'
                                );
                            }
                        })
                        .catch(error => {
                            console.error('Error deleting job:', error);
                            Swal.fire(
                                'Error!',
                                'An error occurred while deleting the job.',
                                'error'
                            );
                        });
                }
            });
        }
    </script>

</body>

</html>
