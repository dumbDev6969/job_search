<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JXT</title>
    <link rel="stylesheet" href="/assets/fonts.css">
    <link rel="stylesheet" href="/assets/scheme.css">
    <!-- AOS CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous">
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="/assets/general.css">

</head>

<body>
    <style>
        .table-container {
            overflow: auto;
            max-height: 400px;
        }

        .fixed-filters {
            position: sticky;
            top: 0;
            background: white;
            z-index: 100;
            padding-bottom: 10px;
        }
    </style>


{% include 'components/recruiter-nav.html' %}

    <div class="container pt-5 mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Candidate Search</h2>
            <div class="text-muted">Showing 24 candidates</div>
        </div>
        
        <!-- Search and Filters -->
        <div class="card mb-4 border-0 shadow-sm" data-aos="fade-right">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-4">
                        <div class="search-box position-relative">
                            <i class="fas fa-search position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"></i>
                            <input type="text" class="form-control ps-5" placeholder="Search by name, skills..." id="search">
                        </div>
                    </div>
                    <div class="col-md-8">
                        <div class="row g-2">
                            <div class="col-md">
                                <select name="salary-range" title="Select a salary range" id="salary">
                                    <option value="" selected>All Salary Ranges</option>
                                    <option>20,000 - 35,000</option>
                                    <option>35,000 - 50,000</option>
                                    <option>50,000 - 75,000</option>
                                    <option>75,000+</option>
                                </select>
                            </div>
                            <div class="col-md">
                                <select name="location" title="Select a location" id="location">
                                    <option value="" selected>All Locations</option>
                                    <option>Remote</option>
                                    <option>On-site</option>
                                    <option>Hybrid</option>
                                </select>
                            </div>
                            <div class="col-md">
                                <select name="skills" title="Select a skill" id="skills">
                                    <option value="" selected>All Skills</option>
                                    <option>JavaScript</option>
                                    <option>Python</option>
                                    <option>UI/UX</option>
                                    <option>AI/ML</option>
                                </select>
                            </div>
                            <div class="col-md-auto">
                                <button class="btn btn-outline-danger w-100">
                                    <i class="fas fa-trash-alt me-1"></i> Remove
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    
        <!-- Candidates Table -->
        <div class="card border-0 shadow-sm" data-aos="fade-up">
            <div class="table-responsive" style="max-height: 500px; overflow-y: auto;">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light" style="position: sticky; top: 0; z-index: 1; background-color: white;">
                        <tr>
                            <th width="40"><input type="checkbox" class="form-check-input" id="select-all"></th>
                            <th>Name</th>
                            <th>Status</th>
                            <th>Skills</th>
                            <th>Salary Expectation</th>
                            <th>Location</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="table-listing">
                        <!-- Table rows remain the same as before -->
                    
                       
                        <!-- Additional rows... -->
                    </tbody>
                </table>
            </div>
            
            <!-- Pagination -->
            <div class="card-footer bg-white">
                <nav aria-label="Candidate pagination">
                    <ul class="pagination justify-content-center mb-0">
                        <li class="page-item disabled">
                            <a class="page-link" href="#" tabindex="-1">Previous</a>
                        </li>
                        <li class="page-item active"><a class="page-link" href="#">1</a></li>
                        <li class="page-item"><a class="page-link" href="#">2</a></li>
                        <li class="page-item"><a class="page-link" href="#">3</a></li>
                        <li class="page-item">
                            <a class="page-link" href="#">Next</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
    







    <!-- AOS JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script src="/assets/js/animation.js"></script>
    <script>
        AOS.init({
            duration: 1000, // Animation duration (1000ms = 1s)
            once: true, // Run animation only once when scrolling
        });

        const search = document.getElementById('search');
        const salary = document.getElementById('salary');
        const selected_location = document.getElementById('location');
        const skills = document.getElementById('skills');
        const table =  document.getElementById('table-listing');
      document.addEventListener('DOMContentLoaded', () => {
      
        fetch(`/employer/api/get_listing`)
            .then(response => response.text())
            .then(data => {
                    table.innerHTML = data;
            })
        });
           search.addEventListener('keyup', updateTbael);
           salary.addEventListener('change', updateTbael);
           selected_location.addEventListener('change', updateTbael);
           skills.addEventListener('change', updateTbael);

           function updateTbael(){
                const params = new URLSearchParams({
                    search: search.value,
                    salary: salary.value,
                    location: selected_location.value,
                    skills: skills.value,
                });     

                fetch(`/employer/api/get_listing?${params}`)
                    .then(response => response.text())
                    .then(data => {
                        // alert(data);
                            table.innerHTML = data;
                            console.log("data:",data);
                    })
           }


    </script>
</body>

</html>
