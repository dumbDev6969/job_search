<body>
    <style>
        .table-container {
            overflow: auto;
            max-height: 400px;
        }

        .fixed-filters {
            position: sticky;
            top: 0;

{% include 'components/recruiter-nav.html' %}

    <div class="container pt-5 mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Candidate Search</h2>
            <div class="text-muted">Showing <span id="candidate-count"></span> candidates</div>
        </div>
        
        <!-- Search and Filters -->
        <div class="card mb-4 border-0 shadow-sm" data-aos="fade-right">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-4">
                        <div class="search-box position-relative">
                            <i class="fas fa-search position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"></i>
                            <input type="text" class="form-control ps-5" placeholder="Search by name, skills..." id="search">
                        </div>
                    </div>
                    <div class="col-md-8">
                        <div class="row g-2">
                            <div class="col-md">
                                <select name="salary-range" title="Select a salary range" id="salary">
                                    <option value="" selected>All Salary Ranges</option>
                                    <option>20,000 - 35,000</option>
                                    <option>35,000 - 50,000</option>
                                    <option>50,000 - 75,000</option>
                                    <option>75,000+</option>
                                </select>
                            </div>
                            <div class="col-md">
                                <select name="location" title="Select a location" id="location">
                                    <option value="" selected>All Locations</option>
                                    <option>Remote</option>
                                    <option>On-site</option>
                                    <option>Hybrid</option>
                                </select>
                            </div>
                            <div class="col-md">
                                <select name="skills" title="Select a skill" id="skills">
                                    <option value="" selected>All Skills</option>
                                    <option>JavaScript</option>
                                    <option>Python</option>
                                    <option>UI/UX</option>
                                    <option>AI/ML</option>
                                </select>
                            </div>
                            <div class="col-md-auto">
                                <button class="btn btn-outline-danger w-100">
                                    <i class="fas fa-trash-alt me-1"></i> Remove
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    
        <!-- Candidates Table -->
        <div class="card border-0 shadow-sm" data-aos="fade-up">
            <div class="table-responsive" style="max-height: 500px; overflow-y: auto;">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light" style="position: sticky; top: 0; z-index: 1; background-color: white;">
                        <tr>
                            <th width="40"><input type="checkbox" class="form-check-input" id="select-all"></th>
                            <th>Name</th>
                            <th>Status</th>
                            <th>Skills</th>
                            <th>Salary Expectation</th>
                            <th>Location</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="table-listing">
                        <!-- Table rows remain the same as before -->
                    
                       
                        <!-- Additional rows... -->
                    </tbody>
                </table>
            </div>
            
            <!-- Pagination -->
             <div class="card-footer bg-white">
                <nav aria-label="Candidate pagination">
                    <ul class="pagination justify-content-center mb-0" id="pagination">
                        <!-- Pagination links will be dynamically loaded here -->
                    </ul>
                </nav>
            </div>
            
            
        </div>
    </div>
    




    <!-- AOS JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script src="/assets/js/animation.js"></script>
    <script>
        AOS.init({
            duration: 1000, // Animation duration (1000ms = 1s)
            once: true, // Run animation only once when scrolling
        });

        const search = document.getElementById('search');
        const salary = document.getElementById('salary');
        const selected_location = document.getElementById('location');
        const skills = document.getElementById('skills');
        const table =  document.getElementById('table-listing');
        const pagination = document.getElementById('pagination');
        const pageInfo = document.getElementById('page-info');
      document.addEventListener('DOMContentLoaded', () => {
      
                 updateTbaelWithPage(1); // Load initial data for page 1
        });
           search.addEventListener('keyup', () => updateTbaelWithPage(1));
           salary.addEventListener('change', () => updateTbaelWithPage(1));
           selected_location.addEventListener('change', () => updateTbaelWithPage(1));
           skills.addEventListener('change', () => updateTbaelWithPage(1));
           
           

          

           function updatePagination(currentPage, totalPages, totalRecords) {
                pagination.innerHTML = ''; // Clear existing pagination

            

                // Previous Button
                const prevButton = createPaginationButton('Previous', currentPage > 1, currentPage - 1);
                pagination.appendChild(prevButton);

                // Page Numbers - Show all pages like in find_talent.html
                for (let i = 1; i <= totalPages; i++) {
                    const pageButton = createPaginationButton(i, true, i, i === currentPage);
                    pagination.appendChild(pageButton);
                }

                // Next Button
                const nextButton = createPaginationButton('Next', currentPage < totalPages, currentPage + 1);
                pagination.appendChild(nextButton);

                // Update page info text
                const startIndex = (currentPage - 1) * 10 + 1;  // Assuming per_page is 10
                const endIndex = Math.min(currentPage * 10, totalRecords);
                // pageInfo.textContent = `Page ${currentPage} of ${totalPages} (Showing ${startIndex} - ${endIndex} of ${totalRecords})`;
           }

           function createPaginationButton(text, enabled, pageNumber, isActive = false) {
            const li = document.createElement('li');
            li.classList.add('page-item');
            if (!enabled) {
                li.classList.add('disabled');
            }
            if (isActive) {
                li.classList.add('active');
            }

            const a = document.createElement('a');
            a.classList.add('page-link');
            a.textContent = text;
            if (enabled) {
                a.href = '#';
                a.addEventListener('click', (event) => {
                    event.preventDefault();
                    updateTbaelWithPage(pageNumber);
                });
            }
            li.appendChild(a);
            return li;
        }

        function updateTbaelWithPage(page){
            const params = new URLSearchParams({
                    search: search.value,
                    salary: salary.value,
                    location: selected_location.value,
                    skills: skills.value,
                    page: page,
                });     

                fetch(`/employer/api/get_listing?${params}`)
                    .then(response => response.json())
                    .then(data => {
                        // alert(data);
                            table.innerHTML = data.html;
                            document.getElementById('candidate-count').innerText = data.total;                           
                            updatePagination(data.current_page, data.total_pages, data.total);
                            console.log("data:",data);
                    })
        }
    </script>
</body>

</html>
