<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechSprint</title>
    <link rel="stylesheet" href="/assets/fonts.css">
    
    <!-- AOS CSS -->
    <link rel="stylesheet" href="/aos-master/dist/aos.css">

    <link rel="stylesheet" href="/bootstrap-5.3.3-dist/css/bootstrap.min.css">

    <script src="/bootstrap-5.3.3-dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="/assets/general.css">
    <link rel="stylesheet" href="/assets/custom_card.css">
    <style>
        /* Custom styles for the carousel */
        .carousel-item {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-light);
            background-color: var(--background-dark);
        }

        .slide {
            height: 60px;
        }
    </style>
</head>

<body>

    {% include 'components/job-seeker-nav.html' %}

    <div class="container-fluid mt-5 pt-3">
        <div class="row  ">
            <div data-aos="fade-down" class="col-md-3 ">

                <h5 class="fw-bold">Job Filter</h5>

                <div class="mb-3">
                    <label class="fw-bold">Job Type</label>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="fullTime" checked>
                        <label class="form-check-label" for="fullTime">Full-Time</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="partTime">
                        <label class="form-check-label" for="partTime">Part-Time</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="freelance">
                        <label class="form-check-label" for="freelance">Freelance</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="internship">
                        <label class="form-check-label" for="internship">Internship</label>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="fw-bold">Salary Range</label>
                    <div class="d-flex">
                        <input type="number" class="form-control me-2" placeholder="Min">
                        <input type="number" class="form-control" placeholder="Max">
                    </div>
                    <input type="range" class="form-range mt-2">
                </div>

                <div class="mb-3">
                    <label class="fw-bold">Location</label>
                    <select class="form-select" title="Select a location">
                        <option selected>All Locations</option>
                        <option>Remote</option>
                        <option>On-Site</option>
                        <option>Hybrid</option>
                    </select>
                </div>

                <!-- Buttons -->
                <div class="d-flex gap-2">
                    <button class="btn w-50">Clear all</button>
                    <button class="btn-primary w-50 rounded">Apply</button>
                </div>

            </div>
            <div data-aos="fade-left" class="col-md-9">
                <div class="mb-4 d-flex">
                    <form action="#" class="w-100 d-flex">
                        <input type="search" id="job-search" class="form-control me-2" placeholder="Search for jobs...">
                        <button class="btn btn-primary" id="search-button">
                            <i class="fas fa-search"></i>
                        </button>
                    </form>
                </div>
                <div class="row job-cards vh-100">
                    <!-- Job cards will be loaded dynamically -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script src="/assets/js/animation.js"></script>
    <script>
        const searchInput = document.getElementById('job-search');
        searchInput.addEventListener('keyup', function () {
            const searchTerm = searchInput.value.toLowerCase();
            const jobCards = document.querySelectorAll('.job-card');
            searchJobs(searchTerm);
        })
        AOS.init({
            duration: 1000, // Animation duration (1000ms = 1s)
            once: true, // Run animation only once when scrolling
        });

        // Function to fetch and display jobs
        async function fetchJobs() {
            try {
                const response = await fetch('/api/jobseeker/get-jobs');
                if (!response.ok) {
                    throw new Error('Failed to fetch jobs');
                }
                const jobCardsHtml = await response.text();
                document.querySelector('.job-cards').innerHTML = jobCardsHtml;
            } catch (error) {
                console.error('Error:', error);
            }
        }
        async function searchJobs(searchTerm) {
            try {
                const response = await fetch(`/api/jobseeker/get-jobs?search=${encodeURIComponent(searchTerm)}`);
                if (!response.ok) {
                    throw new Error('Failed to fetch jobs');
                }
                const jobCardsHtml = await response.text();
                document.querySelector('.job-cards').innerHTML = jobCardsHtml;
            } catch (error) {
                console.error('Error:', error);
            }
        }

        // Fetch jobs when page loads
        document.addEventListener('DOMContentLoaded', fetchJobs);
    </script>
</body>

</html>
