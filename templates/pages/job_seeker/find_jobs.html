<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobxTech</title>
    <link rel="stylesheet" href="/assets/fonts.css">

    <!-- AOS CSS -->
    <link rel="stylesheet" href="/aos-master/dist/aos.css">

    <link rel="stylesheet" href="/bootstrap-5.3.3-dist/css/bootstrap.min.css">

    <script src="/bootstrap-5.3.3-dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="/assets/general.css">
    <link rel="stylesheet" href="/assets/custom_card.css">

    <!-- SweetAlert2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <!-- SweetAlert2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        /* Custom styles for the carousel */
        .carousel-item {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-light);
            background-color: var(--background-dark);
        }

        .slide {
            height: 60px;
        }
    </style>
</head>

<body>

    {% include 'components/job-seeker-nav.html' %}

    <div class="container-fluid mt-5 pt-3">
        <div class="row  ">
            <div data-aos="fade-down" class="col-md-3 ">

                <h5 class="fw-bold">Job Filter</h5>

                <div class="mb-3">
                    <label class="fw-bold">Job Type</label>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="fullTime">
                        <label class="form-check-label" for="fullTime">Full-Time</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="partTime">
                        <label class="form-check-label" for="partTime">Part-Time</label>
                    </div>
                   
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="internship">
                        <label class="form-check-label" for="internship">Internship</label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="contract">
                        <label class="form-check-label" for="contract">Contract</label>
                    </div>

                </div>



                <div class="mb-3">
                    <label class="fw-bold">Salary Range</label>
                    <select ass="form-control name=" salary-range" title="Select a salary range" id="salary">
                        <option value="" selected>All Salary Ranges</option>
                        <option>20,000 - 35,000</option>
                        <option>35,000 - 50,000</option>
                        <option>50,000 - 75,000</option>
                        <option>75,000+</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="fw-bold">Location</label>
                    <select class="form-select" title="Select a location">
                        <option selected>All Locations</option>
                        <option>Remote</option>
                        <option>On-Site</option>
                        <option>Hybrid</option>
                    </select>
                </div>

                <!-- Buttons -->
                <!-- <div class="d-flex gap-2">
                    <button class="btn w-50">Clear all</button>
                    <button class="btn-primary w-50 rounded">Apply</button>
                </div> -->

            </div>
            <div data-aos="fade-left" class="col-md-9">
                <div class="mb-4 d-flex">
                    <form action="#" class="w-100 d-flex">
                        <input type="search" id="job-search" class="form-control me-2" placeholder="Search for jobs...">
                        <button class="btn btn-primary" id="search-button">
                            <i class="fas fa-search"></i>
                        </button>
                    </form>
                </div>
                <div class="row job-cards vh-100">
                    <!-- Job cards will be loaded dynamically -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/assets/js/animation.js"></script>
    <script>
        const searchInput = document.getElementById('job-search');
        searchInput.addEventListener('keyup', function () {
            const searchTerm = searchInput.value.toLowerCase();
            const jobCards = document.querySelectorAll('.job-card');
            searchJobs(searchTerm);
        })

        salary = document.getElementById('salary');
        salary.addEventListener('change', function () {
            fetchFilteredJobs();
        })

        AOS.init({
            duration: 1000, // Animation duration (1000ms = 1s)
            once: true, // Run animation only once when scrolling
        });

        // Function to fetch and display jobs
        async function fetchJobs() {
            try {
                const response = await fetch('/api/jobseeker/get-jobs');
                if (!response.ok) {
                    throw new Error('Failed to fetch jobs');
                }
                const jobCardsHtml = await response.text();
                document.querySelector('.job-cards').innerHTML = jobCardsHtml;
                        applyToAllForms();
            } catch (error) {
                console.error('Error:', error);
            }
        }
        async function searchJobs(searchTerm) {
            try {
                const response = await fetch(`/api/jobseeker/get-jobs?search=${encodeURIComponent(searchTerm)}`);
                if (!response.ok) {
                    throw new Error('Failed to fetch jobs');
                }
                const jobCardsHtml = await response.text();
                document.querySelector('.job-cards').innerHTML = jobCardsHtml;
                        applyToAllForms();
            } catch (error) {
                console.error('Error:', error);
            }
        }

        async function fetchFilteredJobs() {
            try {
                const jobTypes = getSelectedJobTypes();
                const salary = document.getElementById('salary').value;
                const location = document.querySelector('.form-select[title="Select a location"]').value;
                const search = document.getElementById('job-search').value;

                const params = new URLSearchParams();
                if (search) params.append('search', search);
                if (jobTypes.length > 0) params.append('job_types', jobTypes.join(','));
                if (salary) params.append('salary', salary);
                if (location && location !== 'All Locations') params.append('location', location);

                const response = await fetch(`/api/jobseeker/get-jobs?${params.toString()}`);
                if (!response.ok) {
                    throw new Error('Failed to fetch jobs');
                }
                const jobCardsHtml = await response.text();
                document.querySelector('.job-cards').innerHTML = jobCardsHtml;
            } catch (error) {
                console.error('Error:', error);
                document.querySelector('.job-cards').innerHTML = '<div class="text-danger">Error loading jobs.</div>';
            }
        }

        // Fetch jobs when page loads
        document.addEventListener('DOMContentLoaded', fetchJobs);
                applyToAllForms();
    </script>
    <script>
        // Collect filter values and fetch jobs with filters
        function getSelectedJobTypes() {
            const types = [];
            if (document.getElementById('fullTime').checked) types.push('full_time');
            if (document.getElementById('partTime').checked) types.push('part_time');
            if (document.getElementById('internship').checked) types.push('internship');
            if (document.getElementById('contract').checked) types.push('contract');
            return types;
        }

        function fetchJobs() {
            const jobTypes = getSelectedJobTypes();
            const salary = document.getElementById('salary').value;
            const location = document.querySelector('.form-select[title="Select a location"]').value;
            const search = document.getElementById('job-search').value;

            const params = new URLSearchParams();
            if (search) params.append('search', search);
            if (jobTypes.length > 0) params.append('job_types', jobTypes.join(','));
            if (salary) params.append('salary', salary);
            if (location && location !== 'All Locations') params.append('location', location);

            fetch(`/api/jobseeker/get-jobs?${params.toString()}`)
                .then(response => response.text())
                .then(data => {
                    document.querySelector('.job-cards').innerHTML = data;
                            applyToAllForms();
                })
                .catch(error => {
                    document.querySelector('.job-cards').innerHTML = '<div class="text-danger">Error loading jobs.</div>';
                });
        }

        // Add event listeners to filters
        ['fullTime', 'partTime', 'internship', 'contract'].forEach(id => {

            document.getElementById(id).addEventListener('change', fetchFilteredJobs);
        });
        document.querySelectorAll('.form-control[type="number"]').forEach(input => {
            input.addEventListener('input', fetchFilteredJobs);
        });
        document.querySelector('.form-select[title="Select a location"]').addEventListener('change', fetchFilteredJobs);
        document.getElementById('job-search').addEventListener('input', fetchFilteredJobs);
        document.getElementById('search-button').addEventListener('click', function (e) {
            e.preventDefault();
            fetchFilteredJobs();
        });
        // Initial load
        fetchJobs();


        function setupFormWithSweetAlert(formElement) {
           
            formElement.addEventListener('submit', async function (e) {
                e.preventDefault();

                const formAction = this.getAttribute('action');
                const formMethod = this.getAttribute('method') || 'POST';

                // Show loading alert
                Swal.fire({
                    title: 'Processing...',
                    html: 'Please wait while we process your request',
                    allowOutsideClick: false,
                    didOpen: () => {
                        Swal.showLoading()
                    }
                });

                try {
                    const response = await fetch(formAction, {
                        method: formMethod,
                        body: new FormData(this)
                    });

                    const result = await response.json();

                    Swal.close();

                    if (response.ok) {
                        Swal.fire({
                            icon: 'success',
                            title: 'Success!',
                            text: result.message || 'Action completed successfully'
                        }).then(() => {
                            // Optional: Redirect if specified in response
                            if (result.redirect) {
                                window.location.href = result.redirect;
                            }
                        });
                    } else {
                        Swal.fire({
                            icon: 'error',
                            title: 'Error',
                            text: result.message || 'Action failed'
                        });
                    }
                } catch (error) {
                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: 'Network error occurred'
                    });
                }
            });
        }

        // Apply to all forms on page load
        function applyToAllForms() {

            
                document.querySelectorAll('form').forEach(form => {

                    // Call the setup function for each form on page load
                    setupFormWithSweetAlert(form);
                    // setupFormWithSweetAlert(form);
                });
           
        }
        applyToAllForms();
    </script>
