<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechSprint</title>
    <link rel="stylesheet" href="/assets/fonts.css">
    <link rel="stylesheet" href="/assets/scheme.css">
    <!-- AOS CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous">
    </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="/assets/general.css">
    <style>
        /* Custom styles for the carousel */
        .carousel-item {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-light);
            background-color: var(--background-dark);
        }

        .slide {
            height: 60px;
        }
    </style>
</head>

<body>

    <div class="row d-flex align-items-center justify-content-center mt-5 p-5 ">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
              <li class="breadcrumb-item"><a href="qualification.html">Qualifications</a></li>
              <li class="breadcrumb-item active" aria-current="page">Job Preferences</li>
            </ol>
          </nav>
       <div class="col-md-6">
        <form action="/api/jobseeker/job-interest" method="POST" class="p-4" id="interestForm">
            <div class="mb-3">
                <label for="job_interest" class="form-label">Job Interest</label>
                <input type="text" id="job_interest" name="job_interest" 
                    placeholder="Eg. Frontend Developer, Data Scientist, etc." 
                </div>

                <div class="mb-3">
                    <label for="job_type" class="form-label">Job Type</label>
                    <select id="job_type" name="job_type" required>
                        <option value="" selected disabled>Select job type</option>
                        <option value="Full-time">Full-time</option>
                        <option value="Part-time">Part-time</option>
                        <option value="Freelance">Freelance</option>
                        <option value="Internship">Internship</option>
                    </select>
                </div>

                
                <div class="mb-3">
                    <select name="preferred_location" title="Select a location" id="location" required>
                        <option value="" selected>All Locations</option>
                        <option>Remote</option>
                        <option>On-site</option>
                        <option>Hybrid</option>
                    </select>
                </div>

                <div class="mb-3">
                    <select name="expected_salary_range" title="Select a salary range" id="salary" required>
                        <option value="" selected>All Salary Ranges</option>
                        <option>20,000 - 35,000</option>
                        <option>35,000 - 50,000</option>
                        <option>50,000 - 75,000</option>
                        <option>75,000+</option>
                    </select>
                </div>
                

                <input type="hidden" name="user_id" value="<!--  -->">

                <button type="submit" class="btn-primary w-100 mt-3">Submit</button>
        </form>
       </div>
    </div>


    <!-- AOS JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script src="/assets/js/animation.js"></script>
    <script>
        AOS.init({
            duration: 1000, // Animation duration (1000ms = 1s)
            once: true, // Run animation only once when scrolling
        });

          // Form submission handler
          document.getElementById('interestForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            console.log('Form Values:', {
                job_interest: formData.get('job_interest'),
                job_type: formData.get('job_type'),
                preferred_location: formData.get('preferred_location'),
                salary_range: formData.get('expected_salary_range'),
                user_id: formData.get('user_id')
            });
            fetch('/api/jobseeker/job-interest', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Success!',
                        text: 'Qualification added successfully!',
                        showConfirmButton: false,
                        timer: 1500
                    }).then(() => {
                        window.location.href = '/dashboard';
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Oops...',
                        text: data.message || 'Something went wrong!'
                    });
                }
            })
            .catch(error => {
                Swal.fire({
                    icon: 'error',
                    title: 'Oops...',
                    text: 'An error occurred while saving your qualification details.'
                });
            });
        });
    </script>

</body>

</html>
