<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobxTech</title>
    <link rel="stylesheet" href="/assets/fonts.css">
    <link rel="stylesheet" href="/assets/scheme.css">
    <!-- AOS CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous">
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="/assets/general.css">
    <style>
        /* Custom styles for the carousel */
        .carousel-item {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-light);
            background-color: var(--background-dark);
        }

        .slide {
            height: 60px;
        }
    </style>
</head>

<body>


    <div class="row d-flex align-items-center justify-content-center mt-5 p-5 ">
      <div class="col-md-6">
        <form id="qualificationForm" class="p-4">
            <input type="hidden" id="csrf_token" name="csrf_token" value="{{ csrf_token() }}"/>

            <div class="mb-3">
                <!-- Input Field -->
                <input type="text" id="degreeInput" name="degreeInput"  placeholder="Enter IT degree (e.g., Bachelor of Science...)" list="degreeSuggestions"
                >
              
                <!-- Datalist for Suggestions -->
                <datalist id="degreeSuggestions"></datalist>
              
                <!-- Pills Container -->
                <div id="pillContainer" class="d-flex flex-wrap mt-2"></div>

                <input type="hidden" id="selectedDegrees" name="degrees">
              </div>

            <div class="mb-3">
                <label for="school_graduated" class="form-label">School Graduated</label>
                <input type="text" id="school_graduated" name="school_graduated" 
                    placeholder="Enter your school" required>
            </div>

            <div class="mb-3">
                <label for="certifications" class="form-label">Certifications</label>
                <input type="text" id="certifications" name="certifications" 
                    placeholder="Enter your certifications">
            </div>

            <div class="mb-3">
                <label for="specialized_training" class="form-label">Specialized Training</label>
                <input type="text" id="specialized_training" name="specialized_training" 
                    placeholder="Enter your specialized training">
            </div>

            <input class="" type="hidden" name="user_id" value="<!-- suer_di -->">

            <button type="submit" class=" btn-primary w-100 mt-3">Submit</button>
        </form>
      </div>
    </div>

   <!-- courses -->
    <script src="/assets/js/courses.js"></script>
    <!-- AOS JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script src="/assets/js/animation.js"></script>
    <script>
        AOS.init({
            duration: 1000,
            once: true,
        });

        // Form submission handler
        document.getElementById('qualificationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            
            fetch('/api/jobseeker/qualification', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
               
                if (data.success) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Success!',
                        text: 'Qualification added successfully!',
                        showConfirmButton: false,
                        timer: 1500
                    }).then(() => {
                        window.location.href = '/dashboard';
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Oops...',
                        text: data.error || 'Something went wrong!'
                    });
                }
            })
            .catch(error => {
                Swal.fire({
                    icon: 'error',
                    title: 'Oops...',
                    text: 'An error occurred while saving your qualification details.'
                });
            });
        });
    </script>

</body>

</html>
