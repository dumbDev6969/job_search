<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechSprint</title>
    <link rel="stylesheet" href="/assets/fonts.css">
    <link rel="stylesheet" href="/assets/scheme.css">
    <!-- AOS CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous">
        </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="/assets/general.css">
    <link rel="stylesheet" href="/assets/custom_card.css">
</head>

<body>



    <nav class="navbar navbar-expand-lg ">
        <div class="container-fluid">

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-around" id="navbarNav">
                <ul class="navbar-nav gap-3">
                    <li class="nav-item">
                        <a class="nav-link" href="#">Find jobs</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Skills & Resume</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Profile</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Recommendations</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-3">

                    <!-- User Avatar Dropdown -->
                    <div class="dropdown">
                        <a href="#" class="d-flex align-items-center text-decoration-none dropdown-toggle"
                            id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                            <img src="/assets/img/default_profile.jpg" alt="User Avatar" class="rounded-circle me-2"
                                width="40" height="40">
                        </a>
                        <ul class="dropdown-menu dropdown-menu-right" aria-labelledby="userDropdown">
                            <li><a class="dropdown-item" href="#">Profile Settings</a></li>
                            <li><a class="dropdown-item" href="#">Notifications</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item text-danger" href="#">Logout</a></li>
                        </ul>
                    </div>
                    <!-- CTA Button -->
                    <a href="#" class="btn btn-primary">Explore Jobs</a>

                </div>
            </div>
        </div>
    </nav>

    <div data-aos="fade-up" class="container" style="margin-top: 100px;">
        <div class="row justify-content-center">
            <div class="col-md-10 col-lg-8">
                <h2 class="text-center mb-4">Job Recommendations</h2>

                <!-- Job Cards -->
                <div class="bg-white rounded-3 shadow-sm p-4 mb-4">
                    <div class="d-flex align-items-center mb-3">
                        <img src="/assets/img/default_profile.jpg" class="rounded-circle me-3 img-fluid"
                            style="width: 60px; height: 60px;">
                            
                        <div>
                            <h5 class="mb-0">TechCorp</h5>
                            <small class="text-muted">Frontend Developer</small>
                        </div>
                    </div>
                    <div class="mb-3">
                        <p class="text-secondary mb-1"><i class="fas fa-map-marker-alt me-2"></i> Remote</p>
                        <p class="h5 text-primary">50,000 - 70,000</p>
                    </div>
                    <div class="d-grid gap-2">
                        <button class="btn-outline-primary rounded-pill">
                            <i class="fas fa-check me-2"></i> Accept
                        </button>
                        <button class="btn-outline-secondary rounded-pill">
                            <i class="fas fa-times me-2"></i> Reject
                        </button>
                    </div>
                </div>

                
            </div>
        </div>
    </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script src="/assets/js/animation.js"></script>
    <script>
        AOS.init({
            duration: 1000, // Animation duration (1000ms = 1s)
            once: true, // Run animation only once when scrolling
        });
    </script>
</body>

</html>
