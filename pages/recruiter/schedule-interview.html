<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JXT</title>
  <link rel="stylesheet" href="/assets/fonts.css">
  <link rel="stylesheet" href="/assets/scheme.css">
  <!-- AOS CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous">
    </script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="/assets/general.css">

</head>

<body>

  <style>

  </style>
  </head>

  <body>
    <div class="container mt-5 mb-5">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <!-- Card Enhancements -->
          <div class="card shadow border-0 rounded-4 overflow-hidden" data-aos="fade-up" data-aos-duration="600">

            <!-- Header Gradient -->
            <div class="card-header  text-white" style="background-color: #4A90E2;;">
              <div class="d-flex align-items-center">
                <i class="fas fa-calendar-check fa-2x me-3"></i>
                <div>
                  <h4 class="mb-0 fw-bold">Schedule Interview</h4>
                  <small class="text-white-50">Candidate: John Doe</small>
                </div>
              </div>
            </div>

            <div class="card-body p-4">
              <form>
                <!-- Enhanced Form Groups -->
                <div class="mb-4">
                  <label for="interviewDate" class="form-label text-muted fw-bold">
                    Interview Date
                  </label>
                  <input type="date"  id="interviewDate" required>
                </div>

                <div class="mb-4">
                  <label for="interviewTime" class="form-label text-muted fw-bold">
                     Interview Time
                  </label>
                  <input type="time" id="interviewTime" required>
                </div>

                <!-- Type with Icon -->
                <div class="mb-4">
                  <label for="interviewType" class="form-label text-muted fw-bold">
                    Interview Type
                  </label>
                  <select id="interviewType" required>
                    <option value="" selected disabled>Select type</option>
                    <option value="in-person">In-Person <i class="fas fa-map-marker-alt ms-2"></i></option>
                    <option value="remote">Remote <i class="fas fa-video ms-2"></i></option>
                    <option value="phone">Phone <i class="fas fa-phone ms-2"></i></option>
                  </select>
                </div>

                <!-- Location with Floating Label -->
                <div class="mb-4">
                  <label for="interviewLocation" class="form-label text-muted fw-bold">
                    Interview Location
                  </label>
                  <input type="text" id="interviewLocation" placeholder="Enter location">
                </div>

                <!-- Google Meet Link -->
                <div class="mb-4">
                <label for="googleMeetLink" class="form-label text-muted fw-bold">
                  Google Meet Link
                </label>
                <input type="url" id="googleMeetLink" placeholder="Enter Google Meet URL">
              </div>

                <!-- Notes with Character Counter -->
                <div class="mb-4">
                  <label for="notes" class="form-label text-muted fw-bold">
                    Additional Notes
                  </label>
                  <textarea  id="notes" rows="4" placeholder="Any additional instructions or notes"
                    maxlength="500"></textarea>
                  <small class="text-muted float-end mt-1">0/500 characters</small>
                </div>

                <!-- Submit Button Section -->
                <div class="mt-4">
                  <button type="submit" class="btn-primary ">
                    <i class="fas fa-paper-plane me-2"></i> Schedule Interview
                  </button>
                </div>
              </form>
            </div>

            <!-- Card Footer -->
            <div class="card-footer bg-light text-muted border-top">
              <div class="d-flex align-items-center justify-content-between">
                <small>All fields are required *</small>

              </div>
            </div>
          </div>
        </div>
      </div>
    </div>







    <!-- AOS JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script src="/assets/js/animation.js"></script>
    <script>
      AOS.init({
        duration: 1000, // Animation duration (1000ms = 1s)
        once: true, // Run animation only once when scrolling
      });
    </script>
  </body>

</html>
