<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JXT</title>
    <link rel="stylesheet" href="/assets/fonts.css">
    <link rel="stylesheet" href="/assets/scheme.css">
    <!-- AOS CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous">
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="/assets/general.css">

</head>

<body>

    <style>
        .candidate-card {
            transition: all 0.2s;
            border-left: 4px solid #0d6efd;
        }
        .candidate-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .candidate-avatar {
            width: 48px;
            height: 48px;
            object-fit: cover;
            border-radius: 50%;
        }
        .meet-link {
            background-color: #f8f9fa;
            border-radius: 4px;
            padding: 8px 12px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
          <div class="col-md-8">
            <div class="card shadow-sm">
              <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="fas fa-calendar-check me-2"></i>Schedule Interview</h4>
                <h5>Candidate name</h5>
              </div>
              <div class="card-body">
                <form>
                  
                  
                  <!-- Date Input -->
                  <div class="mb-3">
                    <label for="interviewDate" class="form-label">Interview Date</label>
                    <input type="date"  id="interviewDate" required>
                  </div>
                  <!-- Time Input -->
                  <div class="mb-3">
                    <label for="interviewTime" class="form-label">Interview Time</label>
                    <input type="time"  id="interviewTime" required>
                  </div>
                  <!-- Interview Type -->
                  <div class="mb-3">
                    <label for="interviewType" class="form-label">Interview Type</label>
                    <select  id="interviewType" required>
                      <option value="" selected disabled>Select type</option>
                      <option value="in-person">In-Person</option>
                      <option value="remote">Remote</option>
                      <option value="phone">Phone</option>
                    </select>
                  </div>
                  <!-- Location (optional, shown if in-person) -->
                  <div class="mb-3">
                    <label for="interviewLocation" class="form-label">Location</label>
                    <input type="text"  id="interviewLocation" placeholder="Enter Google Meet URL">
                  </div>
                  <!-- Google Meet Link (optional, for remote interviews) -->
                  <div class="mb-3">
                    <label for="googleMeetLink" class="form-label">Google Meet Link</label>
                    <input type="url"  id="googleMeetLink" placeholder="Enter Google Meet URL">
                  </div>
                  <!-- Additional Notes -->
                  <div class="mb-3">
                    <label for="notes" class="form-label">Additional Notes</label>
                    <textarea  id="notes" rows="4" placeholder="Any additional instructions or notes"></textarea>
                  </div>
                  <!-- Submit Button -->
                  <div class="d-grid">
                    <button type="submit" class="btn btn-primary">
                      <i class="fas fa-paper-plane me-2"></i> Schedule Interview
                    </button>
                  </div>
                </form>
              </div>
              <!-- Optional Footer -->
              <div class="card-footer text-muted text-center">
                Please ensure all details are correct before scheduling.
              </div>
            </div>
          </div>
        </div>
      </div>







    <!-- AOS JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script src="/assets/js/animation.js"></script>
    <script>
        AOS.init({
            duration: 1000, // Animation duration (1000ms = 1s)
            once: true, // Run animation only once when scrolling
        });
    </script>
</body>

</html>
