<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Job Approval</title>

    <!-- Styles -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"  rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css"> 
    
    <!-- Project CSS -->
    <link rel="stylesheet" href="/assets/general.css">
    <link rel="stylesheet" href="/assets/scheme.css">
    <link rel="stylesheet" href="/assets/animation.css">
    <link rel="stylesheet" href="/assets/admin.css">
</head>
<body class="bg-light">

    <!-- Header -->
    <header data-aos="fade-down" class="border-bottom p-2 bg-white shadow-sm">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <h3 class="mb-0">Admin Dashboard</h3>
            <button class="btn d-md-none" type="button" data-bs-toggle="collapse" data-bs-target="#sidebarMenu"
                aria-controls="sidebarMenu" aria-expanded="false" aria-label="Toggle navigation">
                <i class="fas fa-bars fa-lg"></i>
            </button>
        </div>
    </header>

    <!-- Main Layout -->
    <div class="d-flex">

        <!-- Sidebar -->
        <nav data-aos="fade-right" id="sidebarMenu" class="d-md-block sidebar collapse border-end" style="min-width: 250px; height: 100vh;">
            <div class="position-sticky pt-3 px-3">
                <ul class="nav flex-column">
                    <li class="nav-item mb-2">
                        <a class="nav-link active d-flex align-items-center text-dark" href="/admin/dashboard.html">
                            <i class="fas fa-home me-2"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="nav-link d-flex align-items-center text-dark" href="job_approval.html">
                            <i class="fas fa-clipboard-check me-2"></i> Job Approval
                        </a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="nav-link d-flex align-items-center text-dark" href="recruiter_approval.html">
                            <i class="fas fa-user-tie me-2"></i> Recruiter Approval
                        </a>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- Content Area -->
        <main data-aos="fade-left" class="container-fluid py-4" style="flex: 1;">
            
            <!-- Filters -->
            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <div class="row g-3 align-items-end">
                        <div class="col-md-4">
                            <label for="searchInput" class="form-label">Search Job Title</label>
                            <input type="text" class="form-control" id="searchInput" placeholder="e.g. Frontend Developer">
                        </div>
                        <div class="col-md-3">
                            <label for="statusFilter" class="form-label">Status</label>
                            <select class="form-select" id="statusFilter">
                                <option value="all">All Statuses</option>
                                <option value="new">New</option>
                                <option value="pending">Pending</option>
                                <option value="approved">Approved</option>
                                <option value="rejected">Rejected</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="typeFilter" class="form-label">Type</label>
                            <select class="form-select" id="typeFilter">
                                <option value="all">All Types</option>
                                <option value="full-time">Full-Time</option>
                                <option value="part-time">Part-Time</option>
                                <option value="contract">Contract</option>
                                <option value="freelance">Freelance</option>
                            </select>
                        </div>
                        <div class="col-md-2 d-grid gap-2">
                            <button id="filterBtn" class="btn btn-primary">
                                <i class="fas fa-filter me-1"></i> Filter
                            </button>
                            <button id="resetBtn" class="btn btn-secondary">
                                <i class="fas fa-sync-alt me-1"></i> Reset
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Jobs Grid -->
            <div id="jobsContainer" class="row g-4">

                <!-- Example Job Card Template -->
                <div class="col-12 col-md-6 col-lg-4 job-item" 
                     data-status="pending" 
                     data-type="full-time" 
                     data-title="Senior Frontend Developer">
                    <div class="card h-100 shadow-sm">
                        <div class="card-body d-flex flex-column">
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <span class="badge bg-warning bg-opacity-10 text-warning status-badge">
                                    <i class="fas fa-clock me-1"></i> Pending
                                </span>
                                <small class="text-muted">Job ID</small>
                            </div>
                            <h5 class="card-title">Senior Frontend Developer</h5>
                            <p class="text-muted small">We're looking for a senior frontend developer...</p>

                            <div class="mt-3">
                                <div class="d-flex align-items-center mb-2">
                                    <i class="fas fa-map-marker-alt me-2 text-muted"></i>
                                    <span>Remote</span>
                                </div>
                                <div class="d-flex align-items-center mb-2">
                                    <i class="fas fa-dollar-sign me-2 text-muted"></i>
                                    <span>$50,000 - $70,000</span>
                                </div>
                                <div class="d-flex align-items-center">
                                    <i class="fas fa-briefcase me-2 text-muted"></i>
                                    <span>Full-Time</span>
                                </div>
                            </div>

                            <div class="mt-auto d-flex gap-2 pt-3">
                                <button class="btn btn-success btn-sm w-50" onclick="approveJob(this)">
                                    <i class="fas fa-check me-1"></i> Approve
                                </button>
                                <button class="btn btn-outline-danger btn-sm w-50" onclick="rejectJob(this)">
                                    <i class="fas fa-times me-1"></i> Reject
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- More job cards will be inserted dynamically -->

            </div>

            <!-- No Results -->
            <div class="row no-results text-center py-5" id="noResults" style="display: none;">
                <div class="col-12">
                    <i class="fas fa-search fa-3x mb-3 text-muted"></i>
                    <h4>No jobs found</h4>
                    <p class="text-muted">Try adjusting your search or filter criteria</p>
                </div>
            </div>

        </main>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script> 
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script> 
    <script src="/assets/js/animation.js"></script>
    <script src="/assets/js/job_approval.js"></script>

    <script>
        AOS.init({
            duration: 1000,
            once: true
        });
    </script>
</body>
</html>
