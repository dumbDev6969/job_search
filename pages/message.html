<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechSprint</title>
    <link rel="stylesheet" href="/assets/fonts.css">
    
    <!-- AOS CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous">
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="/assets/general.css">
    <link rel="stylesheet" href="/assets/custom_card.css">
</head>
<style>
    .sidebar {
      height: 100vh;
      overflow-y: auto;
    }

    .chat-body {
      flex: 1;
      overflow-y: auto;
    }

    .message.received .bubble {
      background-color: #e9ecef;
      border-top-left-radius: 0;
    }

    .message.sent .bubble {
      background-color: var(--primary);
      color: white;
      border-top-right-radius: 0;
    }
</style>

<body>


    <div class="container-fluid">
        <div class="row g-0 vh-100">
      
          <!-- Sidebar -->
          <div class="col-md-4 border-end sidebar bg-white">
            <div class="d-flex align-items-center p-3 border-bottom">
              <h4 class="mb-0 text-center">Messages</h4>
              <i class="fas fa-envelope ms-auto text-primary"></i>
            </div>
      
            <div class="p-3">
              <input type="text" class="form-control mb-3" placeholder="Find people and groups">
              
              <ul class="list-group list-group-flush">
                <!-- Example Chat Item -->
                <li class="list-group-item d-flex align-items-center p-3">
                  <img src="/assets/img/default_profile.jpg" height="50"class="rounded-circle me-3" alt="Avatar">
                  <div class="flex-grow-1">
                    <div class="fw-bold">TechCorp</div>
                    <small class="text-muted">Schedule...</small>
                  </div>
                  <small class="text-muted">1 Dec 2020</small>
                </li>
                
                <!-- Active Chat Item -->
                <li class="list-group-item d-flex align-items-center p-3 bg-dark-subtle">
                  <img src="/assets/img/default_profile.jpg" height="50" class="rounded-circle me-3" alt="Avatar">
                  <div class="flex-grow-1">
                    <div class="fw-bold">TechSprint</div>
                    <small class="text-muted">Lorem, ipsum dolor.</small>
                  </div>
                  <small class="text-muted">17 Sept 2020</small>
                </li>
      
                
              </ul>
            </div>
          </div>
      
          <!-- Chat Panel -->
          <div class="col-md-8 chat-container d-flex flex-column">
            <div class="d-flex align-items-center p-3 border-bottom bg-white">
              <div class="flex-grow-1">
                <h5 class="mb-0">TechSprint</h5>
                <small class="text-body-tertiary">techsprint@gmail.com</small>
              </div>
              <i class="fas fa-info-circle text-primary fs-4"></i>
            </div>
      
            <!-- Messages -->
            <div class="chat-body p-3">
              <div class="message received mb-3">
                <div class="bubble d-inline-block p-3 rounded-4 bg-light">
                  Lorem ipsum dolor sit amet...
                  <div class="small text-muted mt-1">3 Oct 2019 10:24 am</div>
                </div>
              </div>
      
              <div class="message sent mb-3 text-end">
                <div class="bubble d-inline-block p-3 rounded-4 bg-primary text-white">
                  Lorem ipsum dolor sit amet...
                  <div class="small text-white-50 mt-1">3 Oct 2019 10:30 am</div>
                </div>
              </div>
      
              <!-- Add more messages -->
            </div>
      
            <!-- Input Footer -->
            <div class="p-3 border-top bg-white">
              <div class="input-group">
                <span class="input-group-text bg-white border-end-0">
                  <i class="fas fa-paperclip text-muted"></i>
                </span>
                <input type="text" class="form-control border-start-0" placeholder="Write a message">
                <button class="btn btn-primary  px-3">
                  <i class="fas fa-paper-plane"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>


            <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
            <script src="/assets/js/animation.js"></script>
            <script>
                AOS.init({
                    duration: 1000, // Animation duration (1000ms = 1s)
                    once: true, // Run animation only once when scrolling
                });
            </script>
</body>

</html>
